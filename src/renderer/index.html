      // Make theme loader available globally for dynamic updates
      window.updateTailwindTheme = function(themeColors, boxShadows) {
        if (window.tailwind && window.tailwind.config) {
          window.tailwind.config.theme.extend.colors = themeColors;
          if (boxShadows) {
            window.tailwind.config.theme.extend.boxShadow = boxShadows;
          }
        }

    <style>
      /* Modern scrollbar styling - theme-aware */
      :root {
        --scrollbar-track: var(--color-bg-secondary, #fbf8f4);
        --scrollbar-thumb: var(--color-border-input, #d9cfc4);
        --scrollbar-thumb-hover: var(--color-accent-primary, #c8a882);
      }

      /* Webkit browsers (Chrome, Safari, Edge) */
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }

      ::-webkit-scrollbar-track {
        background: var(--scrollbar-track);
        border-radius: 4px;
      }

      ::-webkit-scrollbar-thumb {
        background: var(--scrollbar-thumb);
        border-radius: 4px;
        transition: background 0.2s ease;
      }

      ::-webkit-scrollbar-thumb:hover {
        background: var(--scrollbar-thumb-hover);
      }

      /* Firefox */
      * {
        scrollbar-width: thin;
        scrollbar-color: var(--scrollbar-thumb) var(--scrollbar-track);
      }

      /* Update scrollbar colors when theme changes */
      [data-theme="dark"] {
        --scrollbar-track: var(--color-bg-secondary, #2d2d2d);
        --scrollbar-thumb: var(--color-border-input, #3a3a3a);
        --scrollbar-thumb-hover: var(--color-accent-primary, #60a5fa);
      }

      [data-theme="light"] {
        --scrollbar-track: var(--color-bg-secondary, #f8f9fa);
        --scrollbar-thumb: var(--color-border-input, #d1d5db);
        --scrollbar-thumb-hover: var(--color-accent-primary, #3b82f6);
      }

      [data-theme="caelestia"] {
        --scrollbar-track: var(--color-bg-secondary, #1d211b);
        --scrollbar-thumb: var(--color-border-input, #2a2f26);
        --scrollbar-thumb-hover: var(--color-accent-primary, #a4d397);
      }

      /* Ensure border colors work via CSS variables even if Tailwind doesn't regenerate */
      .border-border-light {
        border-color: var(--color-border-light) !important;
      }
      
      .border-border-input {
        border-color: var(--color-border-input) !important;
      }
      
      .border-border-color {
        border-color: var(--color-border-color) !important;
      }
      
      /* Also handle border-b (bottom border) variants */
      .border-b.border-border-light {
        border-bottom-color: var(--color-border-light) !important;
      }
      
      .border-b.border-border-input {
        border-bottom-color: var(--color-border-input) !important;
      }

      /* Ensure input fields have visible borders in production - more specific selectors */
      input[class*="border-border-input"],
      select[class*="border-border-input"],
      textarea[class*="border-border-input"] {
        border: 1px solid var(--color-border-input) !important;
        border-width: 1px !important;
      }

      /* Also target elements with border class */
      .border.border-border-input,
      input.border,
      select.border,
      textarea.border {
        border: 1px solid var(--color-border-input) !important;
      }

      /* Ensure focus states work for inputs */
      input[class*="border-border-input"]:focus,
      select[class*="border-border-input"]:focus,
      textarea[class*="border-border-input"]:focus,
      .border.border-border-input:focus {
        border-color: var(--color-accent-primary) !important;
        outline: none !important;
      }
    </style>
